<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#f5f5f7" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Yearly" />
    <meta name="color-scheme" content="light dark" />
    <script>
      (function () {
        try {
          var isDark = localStorage.getItem("lifeCalendar:darkMode") === "true";
          var themeColor = isDark ? "#000000" : "#f5f5f7";
          var colorScheme = isDark ? "dark" : "light";

          document.documentElement.setAttribute("data-theme", colorScheme);
          if (isDark) {
            document.documentElement.classList.add("dark");
          } else {
            document.documentElement.classList.remove("dark");
          }
          document.documentElement.style.colorScheme = colorScheme;

          var themeMeta = document.querySelector('meta[name="theme-color"]');
          if (themeMeta) {
            themeMeta.setAttribute("content", themeColor);
          }
          var statusMeta = document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]');
          if (statusMeta) {
            statusMeta.setAttribute("content", "black-translucent");
          }
        } catch (e) {}
      })();
    </script>
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://accounts.google.com/gsi/client; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https://*.googleusercontent.com; connect-src 'self' https://www.googleapis.com https://oauth2.googleapis.com https://accounts.google.com https://fonts.googleapis.com https://fonts.gstatic.com; frame-src https://accounts.google.com/gsi/ https://accounts.google.com/; worker-src 'self' blob:; object-src 'none'; base-uri 'self';" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <title>Yearly Life View</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg?v=3" />
    <link rel="icon" type="image/png" sizes="192x192" href="./pwa-192x192.png?v=3" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png?v=3" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <meta name="description" content="Personal life-planning and life calendar app that visualizes your year and life as weekly grids with goals, notes, and progress tracking." />
    <meta property="og:title" content="Yearly Life View" />
    <meta property="og:description" content="Personal life-planning and life calendar app that visualizes your year and life as weekly grids with goals, notes, and progress tracking." />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
